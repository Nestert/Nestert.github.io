name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Finish an upload before starting the newest pending CMS update.
concurrency:
  group: yandex-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://omanovar.ru
      ASSET_VERSION: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build site
        id: build
        env:
          WORK_ORDER_SNAPSHOT: ${{ runner.temp }}/work-order.json
        run: npm run check

      - name: Publish site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: bash scripts/deploy-yandex.sh

      - name: Verify published version
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$SITE_URL/deployment.json?revision=$GITHUB_SHA" -o /tmp/deployment.json
          node -e 'const fs = require("node:fs"); const deployed = JSON.parse(fs.readFileSync("/tmp/deployment.json", "utf8")); if (deployed.commit !== process.env.GITHUB_SHA) throw new Error("Published commit does not match this build");'
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$SITE_URL/projects/" -o /dev/null
          echo "Published [$GITHUB_SHA]($SITE_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the Pages CMS work order
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ORDER_SNAPSHOT: ${{ runner.temp }}/work-order.json
        shell: bash
        run: |
          if [[ ! -f "$WORK_ORDER_SNAPSHOT" ]]; then
            echo 'Pages CMS already has the complete work order.'
            exit 0
          fi

          # Only update the revision that supplied the order, so concurrent CMS edits win.
          if commit=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --rawfile order "$WORK_ORDER_SNAPSHOT" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $sha,
                message: {headline: "chore(content): sync work order"},
                fileChanges: {additions: [{path: "src/_data/work-order.json", contents: ($order | @base64)}]}
              }}
            }' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'); then
            echo "Updated the Pages CMS work order in $commit."
          else
            current_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_head" == "$GITHUB_SHA" ]]; then
              exit 1
            fi
            echo "A newer revision is available. Its workflow will update the work order."
          fi
